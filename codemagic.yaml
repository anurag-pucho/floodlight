workflows:
  ios-unsigned-ipa:
    name: Floodlight iOS unsigned IPA
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      node: 20
      xcode: latest
    scripts:
      - name: Install JS dependencies
        script: npm ci || npm install
      - name: Expo prebuild (generate native iOS project)
        script: npx expo prebuild --platform ios --no-install
      - name: Install CocoaPods
        script: |
          cd ios
          pod install --repo-update
      - name: Build unsigned archive
        script: |
          cd ios
          WS=$(ls -d *.xcworkspace | head -1)
          SCHEME=$(xcodebuild -list -json 2>/dev/null | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{try{const j=JSON.parse(d);console.log((j.workspace?.schemes||j.project?.schemes||['Floodlight'])[0])}catch(e){console.log('Floodlight')}})")
          echo "Scheme: $SCHEME / Workspace: $WS"
          archive() {
            xcodebuild \
              -workspace "$WS" \
              -scheme "$SCHEME" \
              -configuration Release \
              -sdk iphoneos \
              -archivePath "$PWD/build/App.xcarchive" \
              archive \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              PROVISIONING_PROFILE=""
          }
          # The Expo macro "scan-modules" step has a 5s deadline that flakes on a
          # cold runner. Retry up to 3x; the macro binary is warm by then.
          archive || { echo "=== archive retry 1 ==="; archive; } || { echo "=== archive retry 2 ==="; archive; }
      - name: Package unsigned .ipa
        script: |
          cd ios/build
          APP=$(ls -d App.xcarchive/Products/Applications/*.app | head -1)
          echo "Packaging: $APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry Floodlight-unsigned.ipa Payload
          ls -lh Floodlight-unsigned.ipa
    artifacts:
      - ios/build/Floodlight-unsigned.ipa
