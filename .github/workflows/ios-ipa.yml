name: iOS IPA (unsigned, for sideloading)

# Builds an UNSIGNED .ipa on a free GitHub-hosted macOS runner.
# Install it with a free Apple ID via iLoader / SideStore / AltStore (they re-sign it).
# Trigger manually (Actions tab -> Run workflow) or on push to the build branch.

on:
  workflow_dispatch:
  push:
    branches: [ feat/core-scorer, main ]

jobs:
  build-ipa:
    runs-on: macos-13
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install JS dependencies
        run: npm ci || npm install

      - name: Expo prebuild (generate native iOS project)
        run: npx expo prebuild --platform ios --no-install

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update

      - name: Resolve scheme name
        id: scheme
        run: |
          cd ios
          SCHEME=$(xcodebuild -list -json 2>/dev/null | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{try{const j=JSON.parse(d);console.log((j.workspace?.schemes||j.project?.schemes||['Floodlight'])[0])}catch(e){console.log('Floodlight')}})")
          echo "name=$SCHEME" >> "$GITHUB_OUTPUT"
          echo "Using scheme: $SCHEME"

      - name: Build unsigned archive
        run: |
          cd ios
          WS=$(ls -d *.xcworkspace | head -1)
          xcodebuild \
            -workspace "$WS" \
            -scheme "${{ steps.scheme.outputs.name }}" \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$PWD/build/App.xcarchive" \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package unsigned .ipa
        run: |
          cd ios/build
          APP=$(ls -d App.xcarchive/Products/Applications/*.app | head -1)
          echo "Packaging: $APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry Floodlight-unsigned.ipa Payload
          ls -lh Floodlight-unsigned.ipa

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: Floodlight-ipa
          path: ios/build/Floodlight-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
